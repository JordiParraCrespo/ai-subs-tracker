name: Deploy

# Puts the API (and the web app) on the production server once CI has passed
# on `main` and pushed their images to GHCR: it copies `docker/` to the server
# over SSH and runs docker/deploy.sh there, which pulls, migrates and restarts.
# The server's own `.env` is never touched; it is written once, by hand
# (docker/README.md). Settings live on the `production` environment:
#
#   secrets  DEPLOY_SSH_KEY      a private key the server's deploy user accepts
#            DEPLOY_KNOWN_HOSTS  `ssh-keyscan <host>` output, checked, not trusted on first use
#   vars     DEPLOY_HOST         the server's address
#            DEPLOY_USER         a user in the `docker` group
#            DEPLOY_PATH         the directory holding `.env` (e.g. /srv/resetowl)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer one waits rather than cutting the older off
# mid-migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: gha-vm
    if: |
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')
    environment:
      name: production
      url: https://${{ vars.DEPLOY_API_DOMAIN || 'api.resetowl.com' }}/api/v1/health
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName ${{ vars.DEPLOY_HOST }}
            User ${{ vars.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copy the stack definition
        run: |
          ssh deploy "mkdir -p '${{ vars.DEPLOY_PATH }}/docker'"
          scp docker/docker-compose.prod.yml docker/Caddyfile docker/deploy.sh \
            "deploy:${{ vars.DEPLOY_PATH }}/docker/"

      # The job's own token reads the images; it is gone when the job ends, so
      # the server is logged out again whatever happens.
      - name: Pull, migrate and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh deploy \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          status=0
          ssh deploy "sh '${{ vars.DEPLOY_PATH }}/docker/deploy.sh'" || status=$?
          ssh deploy "docker logout ghcr.io >/dev/null" || true
          exit "$status"

      - name: Check the API answers
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${{ vars.DEPLOY_API_DOMAIN || 'api.resetowl.com' }}/api/v1/ready"; then exit 0; fi
            sleep 5
          done
          echo "The API did not report ready within 150s" >&2
          exit 1

      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
