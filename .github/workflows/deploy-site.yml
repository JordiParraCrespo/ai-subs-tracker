name: Deploy site

# Publishes apps/site (the landing page at resetowl.com) to Cloudflare Pages
# on every push to `main` that could change it. The site is static: the build
# is `astro build` plus its SEO check, and the upload is wrangler's. Settings
# live on the `site` environment:
#
#   secrets  CLOUDFLARE_API_TOKEN   a token with Account → Cloudflare Pages → Edit
#   vars     CLOUDFLARE_ACCOUNT_ID  the account that owns the Pages project
#            CLOUDFLARE_PROJECT     the Pages project's name (default: resetowl)
#            SITE_APP_URL           where "Sign in" goes (default: https://app.resetowl.com)
on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - packages/shared/**
      - packages/frontend/design-system/web/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: gha-vm
    environment:
      name: site
      url: https://resetowl.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_SITE_APP_URL: ${{ vars.SITE_APP_URL || 'https://app.resetowl.com' }}
        run: |
          pnpm exec turbo run build --filter=@flama/site
          cp apps/site/cloudflare/_headers apps/site/dist/_headers

      - name: Upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx wrangler@4.156.0 pages deploy apps/site/dist
          --project-name="${{ vars.CLOUDFLARE_PROJECT || 'resetowl' }}"
          --branch=main
          --commit-hash="${{ github.sha }}"
          --commit-dirty=false
