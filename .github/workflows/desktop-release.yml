name: Desktop release

# Builds the macOS app (arm64 and x64, dmg and zip), signs it with the
# Developer ID Application certificate, has Apple notarize it, and attaches it
# to a GitHub release. Runs on a tag `desktop-v<version>` matching
# apps/desktop/package.json, or by hand (which builds a draft release).
# Signing needs macOS, so this is the one job on a GitHub-hosted Mac.
#
# Secrets live on the `apple` environment (apps/desktop/README.md, Releasing):
#
#   MAC_CERTIFICATE_P12_BASE64  the Developer ID Application certificate and key, `base64 -i cert.p12`
#   MAC_CERTIFICATE_PASSWORD    the password the .p12 was exported with
#   APPLE_API_KEY_P8            an App Store Connect API key's .p8 file, as text
#   APPLE_API_KEY_ID            that key's ID
#   APPLE_API_ISSUER            the issuer ID shown above the keys list
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mac:
    name: macOS (signed and notarized)
    runs-on: macos-15
    environment: apple
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Read the version
        id: version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "desktop-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/desktop/package.json ($version)" >&2
            exit 1
          fi

      # The screens are the web app's static build, copied into the app.
      # flama:begin web
      - name: Build the screens
        run: pnpm exec turbo run build --filter=@flama/web
      # flama:end web

      - name: Write the notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      # electron-builder imports the certificate into a throwaway keychain,
      # signs every binary with the hardened runtime, then notarizes and
      # staples because the APPLE_API_* variables are set.
      - name: Package, sign and notarize
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm --filter @flama/desktop package --mac --publish never

      - name: Verify the signature and the notarization ticket
        run: |
          for app in apps/desktop/release/mac*/ResetOwl.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          done

      - name: Attach to a release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="desktop-v$VERSION"
          files=$(ls apps/desktop/release/*.dmg apps/desktop/release/*.zip)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            draft=$([ "$GITHUB_REF_TYPE" = tag ] || echo --draft)
            gh release create "$tag" $files $draft --target "$GITHUB_SHA" \
              --title "ResetOwl $VERSION" --generate-notes
          fi

      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
