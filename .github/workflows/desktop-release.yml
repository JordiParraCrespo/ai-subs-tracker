name: Desktop release

# Builds the desktop app for every platform and publishes it as a GitHub
# release, which the site's download page links to through
# `releases/latest/download/<file>` (apps/site/src/config/site.ts). The file
# names carry no version for that reason (`artifactName` in
# apps/desktop/electron-builder.json).
#
#   macOS    dmg and zip, arm64 and x64, signed with the Developer ID
#            Application certificate and notarized by Apple
#   Windows  NSIS installer, x64 (not code-signed yet)
#   Linux    AppImage, x86_64
#
# Each platform also uploads its update feed (`latest.yml`, `latest-mac.yml`,
# `latest-linux.yml`) and the blockmaps. The installed app reads the feed from
# the same `releases/latest/download/` (`publish` in electron-builder.json),
# so it only ever sees a published release, never the draft.
#
# Runs on a tag `desktop-v<version>` matching apps/desktop/package.json, or by
# hand, which leaves the release a draft. The release is created as a draft,
# each platform uploads to it, and only then is it published with a
# SHA256SUMS file: "latest" never points at a release missing an installer.
#
# The macOS secrets live on the `apple` environment (apps/desktop/README.md,
# Releasing):
#
#   MAC_CERTIFICATE_P12_BASE64  the Developer ID Application certificate and key, `base64 -i cert.p12`
#   MAC_CERTIFICATE_PASSWORD    the password the .p12 was exported with
#   APPLE_API_KEY_P8            an App Store Connect API key's .p8 file, as text
#   APPLE_API_KEY_ID            that key's ID
#   APPLE_API_ISSUER            the issuer ID shown above the keys list
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Draft the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the version
        id: version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "desktop-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/desktop/package.json ($version)" >&2
            exit 1
          fi
          echo "tag=desktop-v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "ResetOwl $VERSION" --generate-notes
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (signed and notarized)
            os: macos-15
            platform: mac
            environment: apple
          - name: Windows
            os: windows-latest
            platform: win
          - name: Linux
            os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    environment: ${{ matrix.environment }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The screens are the web app's static build, copied into the app.
      # flama:begin web
      - name: Build the screens
        run: pnpm exec turbo run build --filter=@flama/web
      # flama:end web

      - name: Write the notarization key
        if: matrix.platform == 'mac'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      # On macOS electron-builder imports the certificate into a throwaway
      # keychain, signs every binary with the hardened runtime, then notarizes
      # and staples because the APPLE_API_* variables are set. The secrets
      # are empty elsewhere, and only the `apple` environment holds them.
      - name: Package
        env:
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CERTIFICATE_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'mac' }}
        run: pnpm --filter @flama/desktop package --${{ matrix.platform }} --publish never

      - name: Verify the signature and the notarization ticket
        if: matrix.platform == 'mac'
        run: |
          for app in apps/desktop/release/mac*/ResetOwl.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          done

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(apps/desktop/release/*.dmg apps/desktop/release/*.zip \
                 apps/desktop/release/*.exe apps/desktop/release/*.AppImage \
                 apps/desktop/release/*.blockmap apps/desktop/release/latest*.yml)
          [ ${#files[@]} -gt 0 ] || { echo "nothing was packaged" >&2; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber

      - name: Forget the key
        if: always() && matrix.platform == 'mac'
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add the checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'ResetOwl-*'
          sha256sum ResetOwl-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

      # A tag publishes it, which makes it "latest" and the site's links
      # resolve to it; a run by hand stays a draft to look at first.
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
