# =============================================================================
# Static delivery for the site (Astro, static output)
# =============================================================================
# The same policy as apps/web/nginx.conf, minus the API proxy: the page talks
# to nothing but its own origin. `theme-init.js` is a file rather than an
# inline script so `script-src 'self'` needs no exception.
map $uri $site_cache_control {
    # The pages, `/theme-init.js`, `/og.png` and the sitemap keep their URL
    # across releases, so they are revalidated.
    default    "no-cache";
    # Astro's output under /_astro/ is content-hashed and never changes.
    ~^/_astro/ "public, max-age=31536000, immutable";
}

# tokenaitor.com was the name for a day; it stays registered and sends every
# path to the same page on resetowl.com.
server {
    listen 3002;
    server_name tokenaitor.com www.tokenaitor.com;
    return 301 https://resetowl.com$request_uri;
}

server {
    listen 3002 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # The Docker build precompresses text assets; `gzip` covers the rest.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types application/javascript text/javascript application/json application/xml image/svg+xml text/css text/plain;

    add_header Cache-Control $site_cache_control always;

    # `style-src 'unsafe-inline'`: the stylesheet is inlined into each page
    # (`inlineStylesheets: 'always'`), and the avatars and stat grid size
    # themselves with style attributes. Scripts stay same-origin files.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Astro writes one directory per page (`/es/codex-pricing/index.html`).
    # A path that matches none is a real 404, never the home page again.
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/index.html =404;
    }
}
