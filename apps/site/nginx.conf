# =============================================================================
# Static delivery for the prerendered landing page
# =============================================================================
# The same policy as apps/web/nginx.conf, minus the API proxy: the page talks
# to nothing but its own origin. `theme-init.js` is a file rather than an
# inline script so `script-src 'self'` needs no exception.
map $uri $site_cache_control {
    # `index.html`, `/theme-init.js` and `/favicon.svg` keep their URL across
    # releases, so they are revalidated.
    default    "no-cache";
    # Vite's output under /assets/ is content-hashed and never changes.
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 3002;
    root /usr/share/nginx/html;
    index index.html;

    # The Docker build precompresses text assets; `gzip` covers the rest.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types application/javascript text/javascript application/json image/svg+xml text/css text/plain;

    add_header Cache-Control $site_cache_control always;

    # `style-src 'unsafe-inline'`: React renders a `style` prop as an attribute,
    # which the avatars and the stat grid use for their data-driven sizes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # One page: anything else is a 404, not a copy of the home page under
    # another URL.
    location = / {
        try_files /index.html =404;
    }
    location / {
        try_files $uri =404;
    }
}
