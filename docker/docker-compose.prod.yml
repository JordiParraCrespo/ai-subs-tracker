services:
  postgres:
    # Every image is pinned by digest (the tag beside it is for the reader):
    # a moving tag would bring an unreviewed binary in on the next restart.
    # Update one with `docker buildx imagetools inspect <image>:<tag>`.
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    restart: always
    # Only on `data`, which has no route out: the database talks to the API
    # and nothing else.
    networks: [data]
    secrets: [db_password]
    environment:
      POSTGRES_USER: ${DB_USERNAME:-flama}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${DB_DATABASE:-flama}
    # Postgres 18 images keep data in a versioned directory under
    # /var/lib/postgresql (here /var/lib/postgresql/18/docker), so the volume
    # mounts the parent. A volume written by an older major version is not
    # read by this one: move it over with pg_dump/pg_restore or pg_upgrade.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-flama}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: always
    networks: [data]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # Set by docker/deploy.sh to the image it built or pulled, by digest or
    # by commit, never `:latest`; the value in `.env` is only a fallback.
    image: ${API_IMAGE:?set API_IMAGE (docker/deploy.sh does)}
    restart: always
    # `data` for Postgres and Redis, `edge` for cloudflared and the web app's
    # nginx (and the way out, for email and the like).
    networks: [edge, data]
    secrets: [db_password, better_auth_secret]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Every setting the API reads comes from the repo's one `.env`, which the
    # root `.env.example` documents variable by variable. The image does not
    # ship it, and this used to be a hand-kept list of the variables to forward
    # — which drifts: anything missing from it (email delivery, TRUST_PROXY,
    # a plugin's settings) could not be configured at all. Run with
    # `--env-file .env` from the repo root (`pnpm docker:prod`) so the `${…}`
    # values in this file are read from the same file. Required: a production
    # stack without it would boot on the defaults below, so Compose refuses to
    # start instead. It holds no secret: those are files (`secrets:` below).
    env_file:
      - path: ../.env
        required: true
    # Only what this file knows better than `.env`, which it overrides: the
    # service names on the compose network, and the database credentials the
    # `postgres` service above was created with — interpolated from the same
    # source as its own, so the two can never disagree. Nothing here may be a
    # `${VAR}` that is also in `.env` for the API's own sake: an interpolation
    # that resolves blank overrides the real value from `env_file`.
    #
    # The secrets are files, never values: `@flama/env` reads each `<NAME>_FILE`
    # into `<NAME>` at startup (and stops the process if the file is missing),
    # so they stay out of `docker inspect` and the process environment.
    environment:
      NODE_ENV: production
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-flama}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_DATABASE: ${DB_DATABASE:-flama}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # The `redis` service above runs without a password.
      REDIS_PASSWORD: ""
      # flama:plugins api-env
    healthcheck:
      # Liveness, not readiness: `/health` checks nothing but that the process
      # answers, so a restart is only ever for a process that cannot serve.
      # `/ready` (PostgreSQL and Redis) is for a load balancer, not a restart.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No `ports:`: Docker publishes through NAT, past ufw, so a published
    # port is open to the internet whatever the firewall says. The way in is
    # the `cloudflared` service below; on the server itself,
    # `docker compose exec api wget -qO- http://127.0.0.1:3001/api/v1/ready`.

  # The only way in from the internet: an outbound tunnel to Cloudflare,
  # which routes api.resetowl.com (and app.resetowl.com) here by
  # docker/cloudflared/config.yml. The server opens no port; administration
  # is over Tailscale (docker/README.md).
  cloudflared:
    image: cloudflare/cloudflared:2026.11.1@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
    restart: always
    networks: [edge]
    secrets: [tunnel_credentials]
    command:
      - tunnel
      - --config
      - /etc/cloudflared/config.yml
      - --metrics
      - 127.0.0.1:2000
      - run
      - ${TUNNEL_ID:?set TUNNEL_ID in the root .env (cloudflared tunnel list)}
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  # flama:begin web
  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE (docker/deploy.sh does)}
    restart: always
    networks: [edge]
    # nginx resolves the `api` upstream when it starts, and proxies /api to it.
    depends_on:
      api:
        condition: service_healthy
    # The web image is a static Vite build served by nginx — VITE_* values are
    # baked in at image build time. The one runtime knob is CSP_EXTRA_ORIGINS,
    # the origins nginx's Content-Security-Policy admits beyond 'self' (see
    # apps/web/nginx.conf), read from the root `.env` like the API's settings.
    # Unset admits none.
    environment:
      CSP_EXTRA_ORIGINS: ${CSP_EXTRA_ORIGINS:-}
  # flama:end web

  # flama:plugins services

networks:
  # cloudflared, the API and the web app; it has the way out.
  edge:
  # Postgres and Redis, and the API to reach them. `internal` gives it no
  # route to the internet, which closes a way for data to leave.
  data:
    internal: true

# Files in SECRETS_DIR on the server (/srv/secrets, a root-only directory),
# mounted read-only at /run/secrets/<name>. docker/README.md says how each one
# is made. None is in `.env`, the image or the repository.
secrets:
  db_password:
    file: ${SECRETS_DIR:-/srv/secrets}/db_password
  better_auth_secret:
    file: ${SECRETS_DIR:-/srv/secrets}/better_auth_secret
  tunnel_credentials:
    file: ${SECRETS_DIR:-/srv/secrets}/tunnel_credentials.json

volumes:
  postgres_data:
  redis_data:
